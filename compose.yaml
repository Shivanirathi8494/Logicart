services:
  postgres:
    image: postgres:17
    container_name: logicarts-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: logicarts
      POSTGRES_PASSWORD: logicarts
      POSTGRES_DB: logicarts

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logicarts -d logicarts"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
